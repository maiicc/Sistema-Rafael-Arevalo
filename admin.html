<!DOCTYPE html>
<html lang="es">

<head>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#002D5A">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta charset="UTF-8">
    <title>CEN Rafael Arévalo González - Administración Central</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8fafc;
        }

        .sidebar {
            background: linear-gradient(180deg, #002D5A 0%, #001A35 100%);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }

        .seccion-admin {
            display: none;
            animation: fadeIn 0.4s ease-out;
        }

        .seccion-admin.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }

        ::-webkit-scrollbar-thumb {
            background: #002D5A;
            border-radius: 10px;
        }
    </style>
</head>

<body class="flex h-screen overflow-hidden text-slate-700">

    <!-- Overlay para móvil -->
    <div id="menu-overlay" onclick="toggleMenu()"
        class="fixed inset-0 bg-slate-900/40 z-40 hidden backdrop-blur-sm lg:hidden"></div>

    <!-- SIDEBAR -->
    <aside id="sidebar"
        class="sidebar w-72 text-white flex flex-col fixed inset-y-0 left-0 z-50 transform -translate-x-full lg:translate-x-0 lg:static shadow-2xl">
        <div class="p-8 border-b border-white/10 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-blue-500/20 p-2 rounded-xl"><i class="fas fa-shield-halved text-xl text-blue-300"></i>
                </div>
                <h1 class="text-xs font-extrabold uppercase tracking-widest leading-tight text-left">CEN RAG <br><span
                        class="text-blue-300">ADMIN</span></h1>
            </div>
            <button onclick="toggleMenu()" class="lg:hidden text-white/50"><i class="fas fa-times"></i></button>
        </div>

        <nav class="flex-1 p-6 space-y-3">
            <p class="text-[10px] font-bold text-white/30 uppercase tracking-widest ml-3 mb-2">Módulos Admin</p>
            <button onclick="cambiarSeccionAdmin('docente')"
                class="w-full flex items-center space-x-4 p-4 rounded-2xl hover:bg-white/10 transition-all group active:scale-95">
                <i class="fas fa-chart-pie opacity-50 group-hover:text-blue-300"></i><span
                    class="font-semibold text-sm">Dashboard</span>
            </button>
            <button onclick="cambiarSeccionAdmin('usuarios')"
                class="w-full flex items-center space-x-4 p-4 rounded-2xl hover:bg-white/10 transition-all group active:scale-95">
                <i class="fas fa-users-cog opacity-50 group-hover:text-blue-300"></i><span
                    class="font-semibold text-sm">Usuarios</span>
            </button>
            <button onclick="cambiarSeccionAdmin('notas')"
                class="w-full flex items-center space-x-4 p-4 rounded-2xl hover:bg-white/10 transition-all group active:scale-95">
                <i class="fas fa-file-signature opacity-50 group-hover:text-blue-300"></i><span
                    class="font-semibold text-sm">Control Notas</span>
            </button>
            <button onclick="cambiarSeccionAdmin('inactivos')"
                class="w-full flex items-center space-x-4 p-4 rounded-2xl hover:bg-white/10 transition-all group active:scale-95">
                <i class="fas fa-user-slash opacity-50 group-hover:text-red-400"></i><span
                    class="font-semibold text-sm">Inhabilitados</span>
            </button>
        </nav>

        <div class="p-6">
            <a href="dashboard.html"
                class="w-full p-4 bg-white/5 hover:bg-white/10 transition-all rounded-2xl font-bold flex items-center justify-center space-x-3 text-white border border-white/10">
                <i class="fas fa-arrow-left text-xs"></i><span class="text-xs uppercase tracking-widest">Panel
                    Principal</span>
            </a>
        </div>
    </aside>

    <!-- ÁREA PRINCIPAL -->
    <main class="flex-1 flex flex-col min-w-0 overflow-hidden">

        <!-- TOPBAR -->
        <header
            class="bg-white/80 backdrop-blur-md p-5 flex justify-between items-center border-b border-slate-200 px-6 md:px-10 z-30">
            <div class="flex items-center space-x-5">
                <button onclick="toggleMenu()"
                    class="lg:hidden w-10 h-10 flex items-center justify-center bg-slate-100 rounded-xl text-blue-900 shadow-sm"><i
                        class="fas fa-bars-staggered"></i></button>
                <div>
                    <h2 id="page-title-admin"
                        class="font-extrabold text-slate-800 text-lg md:text-xl tracking-tighter uppercase italic">Panel
                        Docente</h2>
                    <p class="text-[9px] font-bold text-blue-500 uppercase tracking-widest mt-0.5">Gestión de Sistema
                    </p>
                </div>
            </div>

            <div class="flex items-center space-x-3">
                <!-- BOTÓN RECARGAR -->
                <button onclick="cargarTodo()"
                    class="w-10 h-10 flex items-center justify-center bg-slate-50 border border-slate-100 rounded-xl text-blue-600 hover:bg-blue-100 transition-all active:scale-90 shadow-sm">
                    <i class="fas fa-sync-alt text-xs"></i>
                </button>

                <div
                    class="flex items-center space-x-3 bg-slate-50 p-1.5 pr-5 rounded-2xl border border-slate-100 shadow-sm hidden sm:flex">
                    <div class="w-10 h-10 bg-blue-900 rounded-xl flex items-center justify-center text-white shadow-lg">
                        <i class="fas fa-user-shield text-sm"></i>
                    </div>
                    <p id="userName" class="text-xs font-bold text-slate-700"></p>
                </div>
            </div>
        </header>

        <div class="p-5 md:p-10 overflow-y-auto flex-1 space-y-10">

            <!-- 1. DASHBOARD STATS -->
            <div id="sec-docente" class="seccion-admin active space-y-8">
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">
                    <div
                        class="glass-card p-7 rounded-[2.5rem] border-l-[10px] border-blue-500 shadow-xl shadow-blue-900/5">
                        <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Estudiantes</p>
                        <p id="stat-estudiantes" class="text-4xl font-black text-slate-800">0</p>
                    </div>
                    <div
                        class="glass-card p-7 rounded-[2.5rem] border-l-[10px] border-red-500 shadow-xl shadow-red-900/5">
                        <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">En Riesgo</p>
                        <p id="stat-alertas" class="text-4xl font-black text-red-600">0</p>
                    </div>
                    <div
                        class="glass-card p-7 rounded-[2.5rem] border-l-[10px] border-green-500 shadow-xl shadow-green-900/5">
                        <p class="text-[10px] font-black text-slate-400 uppercase mb-2">Evaluaciones</p>
                        <p id="stat-evaluaciones" class="text-4xl font-black text-slate-800">0</p>
                    </div>
                </div>

                <div class="bg-white p-8 rounded-[3rem] shadow-2xl border border-slate-100">
                    <h3 class="text-sm font-black text-blue-900 mb-8 uppercase tracking-widest italic">Registrar Nota
                        (Modo Admin)</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                        <select id="select-estudiante"
                            class="p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl text-sm font-bold text-slate-600 outline-none focus:border-blue-500"></select>
                        <select id="mat"
                            class="p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl text-sm font-bold text-slate-600 outline-none">
                            <option>Matemáticas</option>
                            <option>Castellano</option>
                            <option>G.H.C</option>
                            <option>Educación Física</option>
                            <option>Biología</option>
                            <option>Física</option>
                            <option>Química</option>
                            <option>Inglés</option>
                        </select>
                        <input type="number" id="nota" placeholder="Nota"
                            class="p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl text-sm outline-none focus:border-blue-500">
                        <button onclick="saveNotaAdmin()"
                            class="bg-blue-600 text-white rounded-2xl font-black text-xs hover:bg-blue-700 transition-all uppercase shadow-lg py-4">Guardar</button>
                    </div>
                </div>
            </div>

            <!-- 2. GESTIÓN USUARIOS -->
            <div id="sec-usuarios" class="seccion-admin">
                <div class="bg-white rounded-[3rem] shadow-xl overflow-x-auto border border-slate-100">
                    <table class="w-full text-left min-w-[700px]">
                        <thead>
                            <tr
                                class="text-[10px] font-black uppercase text-slate-400 tracking-widest border-b-2 border-slate-50">
                                <th class="p-8">Nombre Completo</th>
                                <th>Cédula</th>
                                <th>Rol</th>
                                <th class="text-center">Acción</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-usuarios-admin" class="divide-y divide-slate-50"></tbody>
                    </table>
                </div>
            </div>

            <!-- 3. CONTROL DE NOTAS -->
            <div id="sec-notas" class="seccion-admin">
                <div class="bg-white rounded-[3rem] shadow-xl overflow-x-auto border border-slate-100">
                    <table class="w-full text-left min-w-[700px]">
                        <thead>
                            <tr
                                class="text-[10px] font-black uppercase text-slate-400 tracking-widest border-b-2 border-slate-50">
                                <th class="p-8">Estudiante</th>
                                <th>Materia</th>
                                <th class="text-center">Nota</th>
                                <th class="text-center">Acción</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-notas-admin" class="divide-y divide-slate-50 text-sm"></tbody>
                    </table>
                </div>
            </div>

            <!-- 4. INHABILITADOS -->
            <div id="sec-inactivos" class="seccion-admin">
                <div class="bg-white rounded-[3rem] shadow-xl overflow-x-auto border border-red-50">
                    <table class="w-full text-left min-w-[800px]">
                        <thead>
                            <tr
                                class="text-[10px] font-black uppercase text-red-400 tracking-widest border-b-2 border-red-50 bg-red-50/30">
                                <th class="p-8">Usuario</th>
                                <th>Cédula</th>
                                <th>Motivo</th>
                                <th class="text-center">Reactivar</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-inactivos-admin" class="divide-y divide-red-50 text-sm"></tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <script>
        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('-translate-x-full');
            document.getElementById('menu-overlay').classList.toggle('hidden');
        }

        window.onload = () => {
            if (localStorage.getItem('rol') !== 'Admin') window.location.href = 'dashboard.html';
            document.getElementById('userName').innerText = localStorage.getItem('usuario');
            cargarTodo();
        };

        // FUNCIÓN MAESTRA: Actualiza todos los datos sin recargar la página
        async function cargarTodo() {
            console.log("🔄 Actualizando datos administrativos...");
            await Promise.all([
                cargarDatosAdmin(),
                cargarUsuarios(),
                cargarInactivos(),
                cargarNotasAdmin()
            ]);
        }

        function cambiarSeccionAdmin(sec) {
            document.querySelectorAll('.seccion-admin').forEach(s => s.classList.remove('active'));
            document.getElementById('sec-' + sec).classList.add('active');
            const titulos = { 'docente': 'Panel Docente', 'usuarios': 'Gestión de Usuarios', 'notas': 'Control de Notas', 'inactivos': 'Cuentas Inhabilitadas' };
            document.getElementById('page-title-admin').innerText = titulos[sec];
            if (window.innerWidth < 1024) toggleMenu();
        }

        async function cargarDatosAdmin() {
            const res = await fetch('/stats-docente'); const d = await res.json();
            document.getElementById('stat-estudiantes').innerText = d.estudiantes;
            document.getElementById('stat-alertas').innerText = d.alertas;
            document.getElementById('stat-evaluaciones').innerText = d.evaluaciones;

            const re = await fetch('/estudiantes-lista'); const ests = await re.json();
            const sel = document.getElementById('select-estudiante'); sel.innerHTML = '<option value="">Seleccione Estudiante...</option>';
            ests.forEach(e => { sel.innerHTML += `<option value="${e.nombre_completo}">${e.nombre_completo}</option>`; });
        }

        async function cargarUsuarios() {
            const res = await fetch('/admin/usuarios'); const data = await res.json();
            const t = document.getElementById('tabla-usuarios-admin'); t.innerHTML = "";
            data.forEach(u => {
                if (u.rol !== 'Admin') {
                    t.innerHTML += `<tr class="hover:bg-slate-50 transition-all"><td class="p-8 font-bold text-slate-800">${u.nombre} ${u.apellido}</td><td class="text-sm font-semibold">${u.cedula}</td><td><select onchange="cambiarRol(${u.id_usuario}, this.value)" class="p-2 bg-slate-100 rounded-xl text-[10px] font-black uppercase focus:ring-2 focus:ring-blue-500 outline-none"><option value="Estudiante" ${u.rol === 'Estudiante' ? 'selected' : ''}>Estudiante</option><option value="Docente" ${u.rol === 'Docente' ? 'selected' : ''}>Docente</option><option value="Representante" ${u.rol === 'Representante' ? 'selected' : ''}>Representante</option></select></td><td class="text-center"><button onclick="cambiarEstado(${u.id_usuario}, 0)" class="w-10 h-10 rounded-xl text-red-500 hover:bg-red-50"><i class="fas fa-user-slash"></i></button></td></tr>`;
                }
            });
        }

        async function cargarInactivos() {
            const res = await fetch('/admin/usuarios-inactivos'); const data = await res.json();
            const t = document.getElementById('tabla-inactivos-admin'); t.innerHTML = "";
            if (data.length === 0) t.innerHTML = '<tr><td colspan="4" class="p-10 text-center text-slate-300 italic">No hay cuentas inhabilitadas</td></tr>';
            data.forEach(u => {
                t.innerHTML += `<tr class="bg-red-50/20"><td class="p-8 font-bold text-red-900">${u.nombre} ${u.apellido}</td><td>${u.cedula}</td><td class="text-[10px] uppercase font-black text-blue-900 italic">${u.inhabilitado_por || 'Sistema'}</td><td class="text-center"><button onclick="cambiarEstado(${u.id_usuario}, 1)" class="bg-green-600 text-white px-5 py-2 rounded-xl text-[10px] font-black uppercase shadow-lg active:scale-95 transition-all">Reactivar</button></td></tr>`;
            });
        }

        async function cargarNotasAdmin() {
            const res = await fetch('/admin/notas'); const data = await res.json();
            const t = document.getElementById('tabla-notas-admin'); t.innerHTML = "";
            data.forEach(n => {
                t.innerHTML += `<tr><td class="p-8 font-bold text-slate-700">${n.estudiante}</td><td class="italic">${n.asignatura}</td><td class="text-center font-black text-blue-600 text-lg">${n.nota}</td><td class="text-center"><button onclick="borrarNota(${n.id_nota})" class="w-10 h-10 rounded-xl text-red-400 hover:bg-red-50"><i class="fas fa-trash-alt"></i></button></td></tr>`;
            });
        }

        async function cambiarEstado(id, activo) {
            const admin_nombre = localStorage.getItem('usuario');
            if (!confirm(activo === 0 ? "¿Desea inhabilitar a este usuario?" : "¿Desea reactivar esta cuenta?")) return;

            const res = await fetch(`/admin/usuarios/${id}/estado`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ activo: Number(activo), admin_nombre })
            });

            if (res.ok) {
                await cargarTodo(); // ESTO ACTUALIZA LA UI SIN RECARGAR PÁGINA
            }
        }

        async function saveNotaAdmin() {
            const est = document.getElementById('select-estudiante').value;
            const nota = document.getElementById('nota').value;
            const mat = document.getElementById('mat').value;
            if (!est || !nota) return alert("Complete los datos");
            await fetch('/guardar-nota', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ estudiante: est, asignatura: mat, nota, rol: 'Admin' }) });
            document.getElementById('nota').value = "";
            await cargarTodo();
        }

        async function cambiarRol(id, nuevoRol) {
            await fetch(`/admin/usuarios/${id}/rol`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ nuevoRol }) });
            await cargarTodo();
        }

        async function borrarNota(id) {
            if (confirm("¿Eliminar nota permanentemente?")) {
                await fetch(`/admin/notas/${id}`, { method: 'DELETE' });
                await cargarTodo();
            }
        }
    </script>
</body>

</html>
